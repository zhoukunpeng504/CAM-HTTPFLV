name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Tests use the standard library; video/network dependencies are mocked.
      - name: Run URL parsing, handler and authentication tests
        run: python -m unittest discover -s tests -v

      # Access checks must also remain active when Python assertions are disabled.
      - name: Run authentication tests with Python optimization enabled
        run: python -O -m unittest discover -s tests -p 'test_auth.py' -v
